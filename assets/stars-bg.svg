  <!-- ============ Big Dipper (chom sao Bac Dau), real RA/Dec, ============
       polar-azimuthal projection centered on the true north celestial pole:
       r = (90 - Dec) * 6.2 px/deg, theta = RA. Verified against Wikipedia
       infobox coordinates for all 7 stars (J2000).

       Rotated 90deg, scaled up 1.8x about its own centroid, and shifted
       to the left margin via a single group transform: the star/line
       coordinates below are untouched so they still match the RA/Dec math
       above; only the <g> repositions/resizes them. Polaris itself is laid
       out separately in the right margin (see below) rather than at its
       true relative distance, so the pointer line reads clearly across
       the page instead of the two ending up just ~180px apart. -->
  <g transform="translate(-408.0,-198.24) rotate(90,578.0,664.8) translate(578.0,664.8) scale(1.8) translate(-578.0,-664.8)">

    <!-- asterism outline: handle (Alkaid-Mizar-Alioth-Megrez) + bowl (Megrez-Dubhe-Merak-Phecda-Megrez) -->
    <path class="star-line" d="M485.9,685.0 L522.1,663.0 L550.7,665.2 L586.3,663.9 L642.6,629.9 L652.3,661.8 L606.1,685.0 L586.3,663.9" />

    <!-- the two pointer stars, highlighted -->
    <line class="pointer-line" x1="652.3" y1="661.8" x2="642.6" y2="629.9" />

    <!-- dipper stars, sized roughly by real apparent magnitude -->
    <circle class="dipper-star" cx="642.6" cy="629.9" r="4" />   <!-- Dubhe, mag 1.8 -->
    <circle class="dipper-star" cx="652.3" cy="661.8" r="3.2" /> <!-- Merak, mag 2.4 -->
    <circle class="dipper-star" cx="606.1" cy="685.0" r="3.2" /> <!-- Phecda, mag 2.4 -->
    <circle class="dipper-star" cx="586.3" cy="663.9" r="2.4" /> <!-- Megrez, mag 3.3 -->
    <circle class="dipper-star" cx="550.7" cy="665.2" r="4" />   <!-- Alioth, mag 1.8 -->
    <circle class="dipper-star" cx="522.1" cy="663.0" r="3.5" /> <!-- Mizar, mag 2.1 -->
    <circle class="dipper-star" cx="485.9" cy="685.0" r="3.8" /> <!-- Alkaid, mag 1.9 -->
  </g>

  <!-- animated pointer line: grows from the transformed Dubhe position
       out to Polaris in the right margin, holds, fades, repeats. Lives
       outside the <g> above since its target (Polaris) isn't part of
       that transform. -->
  <line x1="232.8" y1="582.9" x2="232.8" y2="582.9" stroke="#e8c76a" stroke-width="1.6" stroke-dasharray="3 4" opacity="0">
    <animate attributeName="x2" values="232.8;232.8;1087;1087;232.8" keyTimes="0;0.05;0.45;0.85;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="582.9;582.9;380;380;582.9" keyTimes="0;0.05;0.45;0.85;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.15;0.75;0.85;1" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Polaris: placed in the right margin, sized up a bit to match the larger dipper -->
  <circle cx="1087" cy="380" r="11" fill="#f4d47c" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.18;0.4;0.4;0.18;0.18" keyTimes="0;0.4;0.47;0.75;0.82;1" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1087" cy="380" r="5.5" fill="#f4d47c">
    <animate attributeName="r" values="5.5;5.5;8.8;8.8;5.5;5.5" keyTimes="0;0.4;0.47;0.75;0.82;1" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- labels kept upright, centered under each cluster so they fit the narrow page margins -->
  <text class="label" x="112" y="647" text-anchor="middle">Chòm Bắc Đẩu (Big Dipper)</text>
  <text class="label-polaris" x="1087" y="418" text-anchor="middle">Polaris — Sao Bắc Cực</text>
</svg>
