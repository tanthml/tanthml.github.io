<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The Big Dipper (chom sao Bac Dau) and an animated demonstration of how its two pointer stars locate Polaris, the North Star">
  <defs>
    <style>
      .star-line { fill: none; stroke: #7f96b8; stroke-width: 1.2; opacity: 0.55; stroke-linecap: round; stroke-linejoin: round; }
