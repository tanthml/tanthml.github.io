      .dipper-star { fill: #eaf1ff; }
      .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #b9c4d6; letter-spacing: 0.02em; }
      .label-polaris { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f4d47c; letter-spacing: 0.02em; }
    </style>
  </defs>

